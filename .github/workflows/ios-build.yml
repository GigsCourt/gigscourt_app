name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build iOS IPA with Team ID
      env:
        DEVELOPER_TEAM_ID: 62K3DY93D7
      run: |
        flutter build ios --release --no-codesign
        cd build/ios/iphoneos
        mkdir Payload
        cp -r Runner.app Payload/
        zip -r GigsCourt.ipa Payload
        ls -la
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: GigsCourt-iOS
        path: build/ios/iphoneos/GigsCourt.ipa
        retention-days: 30